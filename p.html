<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>...</title>
<meta name="theme-color" content="#000000">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* Заблюренная картинка на фоне */
  .bg-image {
    position: fixed; inset: -30px;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    filter: blur(30px) brightness(0.55) saturate(1.4);
    transform: scale(1.15);
    z-index: 1;
  }
  .bg-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
    z-index: 2;
  }

  /* Центральная кнопка-картинка */
  .center-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  .center-image {
    width: 60vw; max-width: 380px;
    aspect-ratio: 1 / 1;
    border-radius: 30px;
    background-size: cover; background-position: center;
    box-shadow:
      0 0 0 8px rgba(255,255,255,0.15),
      0 0 0 16px rgba(255,255,255,0.08),
      0 30px 80px rgba(0,0,0,0.7);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .center-image:active { transform: scale(0.97); }

  /* Кнопка «Заглушить» — появляется после клика по картинке */
  .mute-btn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    z-index: 9998;
    padding: 16px 40px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #ff0044, #ff6600);
    box-shadow:
      0 10px 30px rgba(255,0,68,0.5),
      0 0 0 0 rgba(255,0,68,0.7);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .mute-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .mute-btn:active {
    transform: translateX(-50%) translateY(0) scale(0.95);
  }
  @keyframes pulse {
    0%, 100% {
      box-shadow:
        0 10px 30px rgba(255,0,68,0.5),
        0 0 0 0 rgba(255,0,68,0.7);
    }
    50% {
      box-shadow:
        0 10px 30px rgba(255,0,68,0.5),
        0 0 0 14px rgba(255,0,68,0);
    }
  }

  /* Видео на весь экран */
  .fullscreen-video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
    z-index: 9999;
    display: none;
  }
  .fullscreen-video.active { display: block; }

  /* Загрузка / ошибка */
  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #666; font-size: 14px;
    z-index: 5;
  }
  .error {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: #ff4757; font-size: 16px;
    padding: 20px; text-align: center;
    z-index: 5;
  }
  .error .subtext { color: #888; font-size: 14px; }

  audio { display: none; }
</style>
</head>
<body>

  <div class="loading" id="loading">Загрузка...</div>

  <div class="bg-image" id="bgImage" style="display:none"></div>
  <div class="bg-overlay" id="bgOverlay" style="display:none"></div>

  <div class="center-wrap" id="centerWrap" style="display:none">
    <div class="center-image" id="centerImage"></div>
  </div>

  <button class="mute-btn" id="muteBtn">🔊 Заглушить</button>

  <video class="fullscreen-video" id="videoEl" playsinline loop></video>
  <audio id="audioEl" loop></audio>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
(function() {
  const firebaseConfig = {
    apiKey: "AIzaSyDGb-vVdeM3vbACbIqQ_Yy4Yom6vsQdViY".replace('Vde','vDde'), // заглушка, ниже перезапишем
    authDomain: "unogame-9414d.firebaseapp.com",
    databaseURL: "https://unogame-9414d-default-rtdb.firebaseio.com",
    projectId: "unogame-9414d",
    storageBucket: "unogame-9414d.firebasestorage.app",
    messagingSenderId: "609200346253",
    appId: "1:609200346253:web:4ca96722ecad9ea0cffec4"
  };
  // Правильный ключ (выше был для обхода копирования)
  firebaseConfig.apiKey = "AIzaSyDGb-vDdeM3vbACbIqQ_Yy4Yom6vsQdViY";

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const loading = document.getElementById('loading');
  const bgImage = document.getElementById('bgImage');
  const bgOverlay = document.getElementById('bgOverlay');
  const centerWrap = document.getElementById('centerWrap');
  const centerImage = document.getElementById('centerImage');
  const muteBtn = document.getElementById('muteBtn');
  const videoEl = document.getElementById('videoEl');
  const audioEl = document.getElementById('audioEl');

  // ============================================================
  // НАСТРОЙКИ
  // ============================================================
  // Куда ведёт кнопка «Заглушить» по умолчанию
  const MUTE_ACTION_URL = 'https://tretiy1337.ru';
  // Открывать в новой вкладке?
  const MUTE_ACTION_NEW_TAB = true;
  // Останавливать звук/видео при клике? (false = звук продолжает играть)
  const MUTE_ACTION_STOP = false;

  // Читаем id из URL
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    loading.outerHTML = '<div class="error"><div>Ошибка</div><div class="subtext">В ссылке нет id пранка</div></div>';
    return;
  }

  // Загружаем пранк из Firebase
  db.ref('custom_pranks/' + id).get().then(snap => {
    if (!snap.exists()) {
      loading.outerHTML = '<div class="error"><div>Пранк не найден</div><div class="subtext">Возможно, ссылка неверна или пранк удалён</div></div>';
      return;
    }

    const prank = snap.val();

    // Показываем фон и центральную картинку
    bgImage.style.backgroundImage = `url('${prank.image}')`;
    centerImage.style.backgroundImage = `url('${prank.image}')`;
    bgImage.style.display = 'block';
    bgOverlay.style.display = 'block';
    centerWrap.style.display = 'flex';
    loading.style.display = 'none';

    if (prank.title) document.title = prank.title;

    // Клик по центральной картинке
    centerImage.addEventListener('click', () => {
      if (prank.mediaType === 'video') {
        // Видео на весь экран
        if (!videoEl.src) videoEl.src = prank.media;
        videoEl.classList.add('active');
        videoEl.play().catch(() => {});
      } else {
        // Звук — играет в цикле
        if (!audioEl.src) audioEl.src = prank.media;
        audioEl.currentTime = 0;
        audioEl.play().catch(() => {});
      }

      // Показываем кнопку «Заглушить»
      muteBtn.classList.add('visible');
    });

    // Кнопка «Заглушить»
    muteBtn.addEventListener('click', () => {
      // 1. Останавливаем звук/видео (если включено)
      if (MUTE_ACTION_STOP) {
        audioEl.pause();
        audioEl.currentTime = 0;
        videoEl.pause();
        videoEl.classList.remove('active');
      }

      // 2. Открываем ссылку
      if (MUTE_ACTION_URL) {
        if (MUTE_ACTION_NEW_TAB) {
          window.open(MUTE_ACTION_URL, '_blank');
        } else {
          window.location.href = MUTE_ACTION_URL;
        }
      }
    });

  }).catch(e => {
    loading.outerHTML = '<div class="error"><div>Ошибка загрузки</div><div class="subtext">' + e.message + '</div></div>';
  });
})();
</script>
</body>
</html>
