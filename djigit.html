<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tprank | tretiy1337.ru</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
        .blur-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(20px); z-index: -1; opacity: 0.9; }
        .sound-btn { cursor: pointer; border: none; padding: 0; background: none; outline: none; z-index: 1; }
        .sound-btn img { width: 200px; height: auto; display: block; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); transition: transform 0.1s, opacity 0.2s; }
        .sound-btn:hover img { transform: scale(1.05); opacity: 1; }
        .sound-btn:active img { transform: scale(0.98); }
    </style>
</head>
<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTX09QIq-982dJn_B3V1MaaJ7EuYNNfByb4381iSpAbzd3t_G1w42i9xXQ&s=10" alt="" class="blur-bg">
    <button id="playBtn" class="sound-btn" aria-label="Воспроизвести звук">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTX09QIq-982dJn_B3V1MaaJ7EuYNNfByb4381iSpAbzd3t_G1w42i9xXQ&s=10" alt="">
    </button>
    <audio id="audioPlayer" loop>
        <source src="https://sndtag.ru/static/assets/funk.mp3" type="audio/mpeg">
    </audio>
    <script>
        const playBtn = document.getElementById('playBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        playBtn.addEventListener('click', () => {
            // Если звук на паузе — запускаем. Если играет — ничего не делаем.
            if (audioPlayer.paused) {
                audioPlayer.volume = 1.0;
                audioPlayer.play().catch(e => console.log('Автовоспроизведение заблокировано', e));
            }
        });
    </script>
</body>
</html>
